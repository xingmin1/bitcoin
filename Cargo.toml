[package]
name = "bitcoin"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
bincode = "1.3.3"
bs58 = "0.5.1"
clap = { version = "4.5.23", features = ["derive"] }
env_logger = "0.11.6"
generic-array = { version = "1.1.1", features = ["alloc", "serde"] }
log = "0.4.22"
num-bigint = { version = "0.4.6", features = ["serde"] }
ripemd = "0.1.3"
rocksdb = "0.23.0"
secp256k1 = { version = "0.30.0", features = ["rand", "serde"] }
serde = { version = "1.0.217", features = ["derive"] }
sha2 = "0.10.8"
thiserror = "2.0.9"
