[package]
name = "bitcoin"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
bincode = "1.3.3"
clap = { version = "4.5.23", features = ["derive"] }
generic-array = { version = "1.1.1", features = ["alloc", "serde"] }
num-bigint = { version = "0.4.6", features = ["serde"] }
rocksdb = "0.23.0"
serde = { version = "1.0.217", features = ["derive"] }
sha2 = "0.10.8"
thiserror = "2.0.9"
